name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        run: npx vitest run
      - name: Engine tests (copy/move/delete, FTP, zip, previews)
        run: node --test --test-concurrency=1 --test-timeout=240000 test/transfer.test.js test/fileops.test.js test/preview.test.js
